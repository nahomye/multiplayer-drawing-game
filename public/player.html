<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <!-- WICHTIG FÜR HANDYS: Verhindert automatisches Zoomen beim Tippen -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fake Artist - Spieler</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: sans-serif; background: #1a252f; color: white; text-align: center; margin-top: 20px; }
        /* touch-action: none verhindert, dass die Seite beim Zeichnen scrollt */
        #canvas { background: white; border-radius: 8px; border: 4px solid #34495e; touch-action: none; max-width: 100%; }
        button { padding: 15px 30px; font-size: 22px; background: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer; transition: 0.3s; margin: 5px; }
        button:hover { background: #2980b9; }
        input { padding: 12px; font-size: 20px; border-radius: 5px; border: none; margin-bottom: 10px; text-align: center; width: 80%; max-width: 300px; }
        .instruction { font-size: 20px; color: #bdc3c7; margin-bottom: 20px; }
        #role-display { color: #f1c40f; font-size: 22px; margin-bottom: 10px; font-weight: bold; }
        
        /* Voting Style */
        #voting-section { background-color: #2c3e50; padding: 20px; border-radius: 10px; margin-top: 20px; display: none; }
        #voting-buttons button { background: #e74c3c; font-size: 18px; }
        #voting-buttons button:hover { background: #c0392b; }
    </style>
</head>
<body>
    <h1>🎨 Fake Artist</h1>
    
    <!-- JOIN BILDSCHIRM -->
    <div id="join-screen">
        <p class="instruction">Gib deinen Namen und den Raumcode ein:</p>
        <input type="text" id="name-input" placeholder="Dein Name" autocomplete="off"><br>
        <input type="text" id="code-input" placeholder="Raumcode" autocomplete="off" style="text-transform: uppercase;"><br>
        <button onclick="joinRoom()">Beitreten</button>
    </div>

    <!-- LOBBY -->
    <div id="lobby" style="display:none;">
        <p class="instruction">Erfolgreich beigetreten! 🎉</p>
        <h2>Warte auf den Host, um das Spiel zu starten...</h2>
    </div>

    <!-- SPIEL BILDSCHIRM -->
    <div id="game-screen" style="display:none;">
        <div id="role-display">Rolle wird geladen...</div>
        <h2 id="status">Warte auf Zug...</h2>
        
        <canvas id="canvas" width="600" height="450"></canvas>
        <br>
        <button id="finish-btn" style="display: none; background: #e74c3c;" onclick="finishTurn()">Zug beenden</button>

        <!-- ABSTIMMUNG FÜR SPIELER -->
        <div id="voting-section">
            <h2>Wer ist der Fake Artist?</h2>
            <div id="voting-buttons"></div>
        </div>
    </div>

    <script>
        const socket = io();
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let currentRoomCode = '';
        let isMyTurn = false;
        let isDrawing = false;

        // 1. Raum beitreten
        function joinRoom() {
            const name = document.getElementById('name-input').value.trim() || "Spieler";
            const code = document.getElementById('code-input').value.trim().toUpperCase();
            if(code) {
                socket.emit('join-room', { roomCode: code, name: name });
            }
        }

        socket.on('error-msg', (msg) => alert(msg));

        socket.on('joined-success', (code) => {
            currentRoomCode = code;
            document.getElementById('join-screen').style.display = 'none';
            document.getElementById('lobby').style.display = 'block';
        });

        // 2. Spiel Infos empfangen
        socket.on('role-info', (data) => {
            if (data.isSpy) {
                document.getElementById('role-display').innerText = "🤫 Du bist der FAKE ARTIST! Versuch dich anzupassen.";
            } else {
                document.getElementById('role-display').innerText = `🎨 Das geheime Wort ist: ${data.word}`;
            }
        });

        socket.on('game-started', (data) => {
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            document.getElementById('status').innerText = `${data.currentPlayer} ist am Zug!`;
        });

        socket.on('next-turn', (data) => {
            document.getElementById('status').innerText = `${data.currentPlayer} ist am Zug!`;
        });

        // 3. Eigener Zug
        socket.on('your-turn', (history) => {
            isMyTurn = true;
            document.getElementById('status').innerText = "Du bist dran! Zeichne einen Strich.";
            document.getElementById('finish-btn').style.display = 'inline-block';
        });

        function finishTurn() {
            if (isMyTurn) {
                isMyTurn = false;
                document.getElementById('finish-btn').style.display = 'none';
                socket.emit('finish-turn', currentRoomCode);
                document.getElementById('status').innerText = "Zug beendet. Warte...";
            }
        }

        // 4. Zeichen-Logik für MAUS und TOUCH (Handy)
        function getMousePos(evt) {
            const rect = canvas.getBoundingClientRect();
            // Prüfen, ob es ein Touch-Event (Handy) oder Maus-Event (PC) ist
            const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
            const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
            
            // Berechnet das richtige Verhältnis, falls das Canvas via CSS verkleinert wurde
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function startPosition(e) {
            if (!isMyTurn) return;
            e.preventDefault(); // Verhindert Scrollen auf dem Handy
            isDrawing = true;
            const pos = getMousePos(e);
            socket.emit('draw-stroke', { roomCode: currentRoomCode, stroke: { type: 'start', x: pos.x, y: pos.y } });
        }

        function endPosition(e) {
            if (!isMyTurn) return;
            e.preventDefault();
            isDrawing = false;
        }

        function draw(e) {
            if (!isDrawing || !isMyTurn) return;
            e.preventDefault();
            const pos = getMousePos(e);
            socket.emit('draw-stroke', { roomCode: currentRoomCode, stroke: { type: 'move', x: pos.x, y: pos.y } });
        }

        // Event Listener PC (Maus)
        canvas.addEventListener('mousedown', startPosition);
        canvas.addEventListener('mouseup', endPosition);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseout', endPosition);

        // Event Listener Handy (Touch) mit { passive: false } um Scrollen zu blockieren
        canvas.addEventListener('touchstart', startPosition, { passive: false });
        canvas.addEventListener('touchend', endPosition, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });

        // 5. Striche synchronisieren
        socket.on('clear-canvas', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });

        socket.on('draw-stroke-all', (data) => {
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#2c3e50';

            if (data.type === 'start') {
                ctx.beginPath();
                ctx.moveTo(data.x, data.y);
            } else if (data.type === 'move') {
                ctx.lineTo(data.x, data.y);
                ctx.stroke();
            }
        });

        // 6. Abstimmung
        socket.on('start-voting', (players) => {
            document.getElementById('voting-section').style.display = 'block';
            document.getElementById('finish-btn').style.display = 'none';
            document.getElementById('status').innerText = "Zeit zur Abstimmung!";
            const votingDiv = document.getElementById('voting-buttons');
            votingDiv.innerHTML = '';

            players.forEach(p => {
                if (p.id !== socket.id) {
                    const btn = document.createElement('button');
                    btn.innerText = p.name;
                    btn.onclick = () => {
                        socket.emit('submit-vote', { roomCode: currentRoomCode, votedForId: p.id });
                        votingDiv.innerHTML = '<p>Abstimmung abgegeben! Warte auf die anderen...</p>';
                    };
                    votingDiv.appendChild(btn);
                }
            });
        });

        socket.on('game-over', (data) => {
            document.getElementById('voting-section').style.display = 'none';
            alert(`🔥 SPIEL ENDE 🔥\n\nDas Wort war: ${data.word}\nDer Spion war: ${data.spyName}`);
            location.reload();
        });
    </script>
</body>
</html>
